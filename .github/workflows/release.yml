name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    if: github.repository_owner != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Create release pull request or publish to npm
        uses: changesets/action@v1
        with:
          publish: pnpm release:ci
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uses npm Trusted Publishing (OIDC). Configure on npmjs.com before first release.
          # Legacy fallback: set repository secret NPM_TOKEN and uncomment the line below.
          # NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
