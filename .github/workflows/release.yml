name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Create a GitHub release for an existing version (e.g. 0.0.2)"
        required: true
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: "@zed-ui"
          always-auth: true
      - run: pnpm install --frozen-lockfile
      - name: Create release pull request or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release:ci
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
          # One combined release is created in the follow-up step.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for npm publish (Automation token with publish access to @zed-ui).
          # Optional: also configure Trusted Publishing on npm for workflow release.yml.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Prepare GitHub release notes
        if: steps.changesets.outputs.published == 'true'
        id: release
        run: |
          VERSION=$(node -e "const pkgs = JSON.parse(process.argv[1]); console.log(pkgs[0].version)" '${{ steps.changesets.outputs.publishedPackages }}')
          node scripts/github-release-notes.mjs "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        if: steps.changesets.outputs.published == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          name: Zed UI v${{ steps.release.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false

  github-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare GitHub release notes
        run: node scripts/github-release-notes.mjs "${{ github.event.inputs.version }}"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Zed UI v${{ github.event.inputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
